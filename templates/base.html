<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{{ title if title else "Home" }} — Your Name</title>
	<meta name="description" content="Portfolio and notes about projects by Your Name." />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
	<header class="site-header">
		<div class="container">
			<h1 class="site-title"><a href="/">Your Name</a></h1>
			<nav class="nav">
				<a href="/">Home</a>
				<a href="#projects">Projects</a>
				<a href="mailto:you@example.com">Contact</a>
			</nav>
		</div>
	</header>

	<main class="container">
		{% block content %}{% endblock %}
	</main>

	<footer class="site-footer container">
		<p>© {{ 2025 }} Your Name</p>
	</footer>
</body>
</html>
